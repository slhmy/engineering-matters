<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 536" width="840" height="536" role="img" aria-label="Experiment 3 schema: width_narrow with a 40 byte payload versus width_wide with a 6.4 kilobyte STORAGE EXTERNAL payload"><style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --faint: #818b98; --border: #d1d9e0; --panel: #f6f8fa; --panel-border: #d1d9e0; --idx: #0969da; --idx-bg: #ddf4ff; --pk: #9a6700; --pk-bg: #fff8c5; --toast: #1a7f37; --toast-bg: #dafbe1; --accent: #8250df; --warn: #cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --faint: #6e7681; --border: #3d444d; --panel: #151b23; --panel-border: #3d444d; --idx: #4493f8; --idx-bg: #12243d; --pk: #d29922; --pk-bg: #33280d; --toast: #3fb950; --toast-bg: #0f2a18; --accent: #a371f7; --warn: #f85149; } }
  text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; }
</style><rect x="0" y="0" width="840" height="536" rx="0" fill="var(--bg)" stroke="none" stroke-width="1"/><text x="24" y="25" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Experiment 3 schema: two widths of the same table</text><text x="24" y="42" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">identical columns and index; only the payload construction and its storage mode differ</text><rect x="24" y="60" width="316" height="180" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/><rect x="24" y="60" width="316" height="28" rx="10" fill="var(--panel)" stroke="none" stroke-width="1"/><rect x="24" y="82" width="316" height="14" rx="0" fill="var(--panel)" stroke="none" stroke-width="1"/><line x1="24" y1="96" x2="340" y2="96" stroke="var(--border)" stroke-width="1" fill="none"/><text x="36" y="83" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="start">width_narrow</text><text x="328" y="83" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end">50,000 rows</text><rect x="25" y="97" width="314" height="22" rx="0" fill="var(--pk-bg)" stroke="none" stroke-width="1"/><text x="36" y="112" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">id</text><text x="328" y="112" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">bigint</text><text x="278.4" y="112" fill="var(--pk)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">PRIMARY KEY</text><rect x="25" y="121" width="314" height="22" rx="0" fill="var(--idx-bg)" stroke="none" stroke-width="1"/><text x="36" y="136" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">bucket</text><text x="328" y="136" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">int</text><text x="298.2" y="136" fill="var(--idx)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">INDEX</text><text x="36" y="160" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">created_at</text><text x="328" y="160" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">timestamp</text><rect x="25" y="169" width="314" height="22" rx="0" fill="var(--toast-bg)" stroke="none" stroke-width="1"/><text x="36" y="184" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">payload</text><text x="328" y="184" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">text</text><text x="291.6" y="184" fill="var(--toast)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">STORAGE</text><line x1="25" y1="192" x2="339" y2="192" stroke="var(--border)" stroke-width="1" fill="none"/><text x="36" y="207" fill="var(--faint)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" text-anchor="start">INDEXES</text><text x="40" y="223" fill="var(--idx)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">└ width_narrow_bucket_idx</text><text x="24" y="258" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">payload = repeat('n', 40)   →  ~40 B, stays on the heap page</text><text x="24" y="290" fill="var(--accent)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start">ALTER TABLE width_wide ALTER COLUMN payload SET STORAGE EXTERNAL</text><rect x="24" y="304" width="316" height="180" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/><rect x="24" y="304" width="316" height="28" rx="10" fill="var(--panel)" stroke="none" stroke-width="1"/><rect x="24" y="326" width="316" height="14" rx="0" fill="var(--panel)" stroke="none" stroke-width="1"/><line x1="24" y1="340" x2="340" y2="340" stroke="var(--border)" stroke-width="1" fill="none"/><text x="36" y="327" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="start">width_wide</text><text x="328" y="327" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="end">50,000 rows</text><rect x="25" y="341" width="314" height="22" rx="0" fill="var(--pk-bg)" stroke="none" stroke-width="1"/><text x="36" y="356" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">id</text><text x="328" y="356" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">bigint</text><text x="278.4" y="356" fill="var(--pk)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">PRIMARY KEY</text><rect x="25" y="365" width="314" height="22" rx="0" fill="var(--idx-bg)" stroke="none" stroke-width="1"/><text x="36" y="380" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">bucket</text><text x="328" y="380" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">int</text><text x="298.2" y="380" fill="var(--idx)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">INDEX</text><text x="36" y="404" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">created_at</text><text x="328" y="404" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">timestamp</text><rect x="25" y="413" width="314" height="22" rx="0" fill="var(--toast-bg)" stroke="none" stroke-width="1"/><text x="36" y="428" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">payload</text><text x="328" y="428" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">text</text><text x="291.6" y="428" fill="var(--toast)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">STORAGE</text><line x1="25" y1="436" x2="339" y2="436" stroke="var(--border)" stroke-width="1" fill="none"/><text x="36" y="451" fill="var(--faint)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" text-anchor="start">INDEXES</text><text x="40" y="467" fill="var(--idx)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">└ width_wide_bucket_idx</text><text x="24" y="502" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">payload = repeat(md5(g::text), 200)  →  ~6.4 kB</text><rect x="366" y="60" width="450" height="176" rx="10" fill="var(--panel)" stroke="var(--panel-border)" stroke-width="1"/><text x="380" y="82" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">WHERE THE BYTES LIVE</text><rect x="380" y="104" width="78" height="15" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/><text x="419.0" y="115" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">heap</text><rect x="464" y="104" width="11" height="15" rx="4" fill="var(--idx)" stroke="none" opacity="0.85"/><text x="743" y="115" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">5.06 MB</text><rect x="380" y="126" width="78" height="15" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/><text x="419.0" y="137" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">heap wide</text><rect x="464" y="126" width="8" height="15" rx="4" fill="var(--idx)" stroke="none" opacity="0.85"/><text x="743" y="137" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">3.83 MB</text><rect x="380" y="148" width="78" height="15" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/><text x="419.0" y="159" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">toast wide</text><rect x="464" y="148" width="260" height="15" rx="4" fill="var(--toast)" stroke="none" opacity="0.85"/><text x="743" y="159" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">~414 MB</text><text x="380" y="192" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">total: 6.9 MB narrow  versus  419.9 MB wide.</text><text x="380" y="207" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">The wide heap is smaller because its values</text><text x="380" y="222" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">left the page and grew its TOAST relation.</text><text x="380" y="237" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">bars use a shared scale within each chart.</text><rect x="366" y="254" width="450" height="226" rx="10" fill="var(--panel)" stroke="var(--panel-border)" stroke-width="1"/><text x="380" y="276" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">WHAT EACH PLAN TOUCHES, 505 ROWS</text><rect x="380" y="300" width="100" height="15" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/><text x="430.0" y="311" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">id, created_at</text><rect x="486" y="300" width="44" height="15" rx="4" fill="var(--toast)" stroke="none" opacity="0.85"/><text x="617" y="311" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">332 buffers / 0.401 ms</text><rect x="380" y="322" width="100" height="15" rx="4" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/><text x="430.0" y="333" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" text-anchor="middle">length(payload)</text><rect x="486" y="322" width="123" height="15" rx="4" fill="var(--warn)" stroke="none" opacity="0.85"/><text x="617" y="333" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="start">2,352 buffers / 19.95 ms</text><text x="380" y="372" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">STORAGE EXTERNAL disables compression, so this</text><text x="380" y="387" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">measures width rather than compressibility.</text><text x="380" y="402" fill="var(--toast)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">SELECT id, created_at    → heap pages only</text><text x="380" y="417" fill="var(--warn)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">SELECT length(payload)  → forces TOAST reads</text></svg>
