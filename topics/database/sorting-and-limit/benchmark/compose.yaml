name: sorting-and-limit

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: sorting_and_limit
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sorting_and_limit"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:15439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql:/benchmark:ro
