name: uuid-primary-keys

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: uuid_primary_keys
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uuid_primary_keys"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./sql:/benchmark:ro
