<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 392" width="840" height="392" role="img" aria-label="Experiment 1 schema: the orders table with a customer_id lookup index and a (created_at, id) pagination index"><style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --faint: #818b98; --border: #d1d9e0; --panel: #f6f8fa; --panel-border: #d1d9e0; --idx: #0969da; --idx-bg: #ddf4ff; --pk: #9a6700; --pk-bg: #fff8c5; --toast: #1a7f37; --toast-bg: #dafbe1; --accent: #8250df; --warn: #cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --faint: #6e7681; --border: #3d444d; --panel: #151b23; --panel-border: #3d444d; --idx: #4493f8; --idx-bg: #12243d; --pk: #d29922; --pk-bg: #33280d; --toast: #3fb950; --toast-bg: #0f2a18; --accent: #a371f7; --warn: #f85149; } }
  text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; }
</style><rect x="0" y="0" width="840" height="392" rx="0" fill="var(--bg)" stroke="none" stroke-width="1"/><text x="24" y="25" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">Experiment 1 schema: orders</text><text x="24" y="42" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">one table, two access paths; the lookup query never changes, only the index portfolio does</text><rect x="24" y="60" width="316" height="192" rx="10" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5"/><rect x="24" y="60" width="316" height="22" rx="10" fill="var(--panel)" stroke="none" stroke-width="1"/><rect x="24" y="76" width="316" height="14" rx="0" fill="var(--panel)" stroke="none" stroke-width="1"/><line x1="24" y1="90" x2="340" y2="90" stroke="var(--border)" stroke-width="1" fill="none"/><text x="36" y="83" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" text-anchor="start">orders</text><rect x="25" y="91" width="314" height="22" rx="0" fill="var(--pk-bg)" stroke="none" stroke-width="1"/><text x="36" y="106" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" text-anchor="start">id</text><text x="328" y="106" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">bigint</text><text x="278.4" y="106" fill="var(--pk)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">PRIMARY KEY</text><rect x="25" y="115" width="314" height="22" rx="0" fill="var(--idx-bg)" stroke="none" stroke-width="1"/><text x="36" y="130" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">customer_id</text><text x="328" y="130" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">bigint</text><text x="278.4" y="130" fill="var(--idx)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">JOIN KEY</text><text x="36" y="154" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">created_at</text><text x="328" y="154" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">timestamp</text><text x="36" y="178" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start">payload</text><text x="328" y="178" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="end">text</text><line x1="25" y1="186" x2="339" y2="186" stroke="var(--border)" stroke-width="1" fill="none"/><text x="36" y="201" fill="var(--faint)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" text-anchor="start">INDEXES</text><text x="40" y="217" fill="var(--idx)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">└ orders_customer_id_idx   (customer_id)</text><text x="40" y="235" fill="var(--idx)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">└ orders_created_at_id_idx  (created_at, id)</text><text x="24" y="270" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">rows = 100,000 / 1,000,000</text><text x="24" y="285" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">payload = repeat('x', 80)</text><rect x="366" y="60" width="450" height="272" rx="10" fill="var(--panel)" stroke="var(--panel-border)" stroke-width="1"/><text x="380" y="82" fill="var(--fg)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">DATA SHAPE</text><text x="380" y="114" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">rows</text><text x="472" y="114" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">:rows</text><text x="380" y="131" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">customer_id</text><text x="472" y="131" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">(id * 7919) % (:rows / 100)</text><text x="380" y="148" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">created_at</text><text x="472" y="148" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">2020-01-01 + id * 1 s</text><text x="380" y="165" fill="var(--muted)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">payload</text><text x="472" y="165" fill="var(--fg)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" text-anchor="start">repeat('x', 80)  →  80 bytes</text><line x1="380" y1="202" x2="802" y2="202" stroke="var(--panel-border)" stroke-width="1" fill="none"/><text x="380" y="222" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">GREATEST(:rows / 100, 1) distinct keys, so</text><text x="380" y="237" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">every key has matches: 1,000 keys at 100k rows</text><text x="380" y="252" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">and 10,000 keys at 1M rows.</text><line x1="380" y1="266" x2="802" y2="266" stroke="var(--panel-border)" stroke-width="1" fill="none"/><text x="380" y="286" fill="var(--accent)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">SAME QUERY, TWO PLANS</text><text x="380" y="306" fill="var(--warn)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">no index   →  Seq Scan   →  test every tuple</text><text x="380" y="321" fill="var(--toast)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">with index →  Index Scan →  descend, then fetch</text><text x="380" y="342" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">The result set is identical; the visited</text><text x="380" y="357" fill="var(--muted)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start">buffers are what changes.</text></svg>
